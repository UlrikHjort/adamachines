# Adamachines: a tag like v1.2.3 makes a GitHub release, once the game builds and passes its tests
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT, gprbuild, GtkAda and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild libgtkada20-dev libgtk-3-dev libpulse-dev

      - name: Build and test
        run: |
          make
          make test

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes are the tag's own message, when it has one
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "Adamachines $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Adamachines $GITHUB_REF_NAME" --generate-notes
          fi
